services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_NAME:-investing}
      POSTGRES_USER: ${POSTGRES_USER:-investing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7.4
    ports:
      - "127.0.0.1:6379:6379"
volumes:
  postgres_data:
